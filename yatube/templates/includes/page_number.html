<form method="get" class="form-inline my-3" id="per_page_form">
    {% for key,value in request.GET.items %}
        {% if key != 'per_page' and key != 'page' %}
            <input type="hidden" name="{{key}}" value="{{value}}">
        {% endif %}
    {% endfor %}

    <input type="hidden" name="page" value="1">
    <label for="per_page" class="mr-2"> Показывать на сайте: </label>
    <select name="per_page" id="per_page" class="form-control" style="width: auto;">
        <option value="1" {% if per_page == 1 %} selected {% endif %}> 1 </option>
        <option value="10" {% if per_page == 10 %} selected {% endif %}>10 </option>
        <option value="25" {% if per_page == 25 %} selected {% endif %}>25 </option>
        <option value="all" {% if per_page == 'all' %} selected {% endif %}> Все </option>
    </select>

    <noscript>
        <button type="submit" class="btn btn-secondery ml-2"> Применить </button>
    </noscript>

</form>
<script>
    document.getElementById('per_page').addEventListener('change', function() {
        document.getElementById('per_page_form').submit();
    })
</script>
